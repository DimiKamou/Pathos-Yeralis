# Local Postgres for development.
#   docker compose up -d      # start the database
#   npm run setup             # push schema + seed
#   npm run dev               # http://localhost:3000
# Matches the default DATABASE_URL in .env.example
# (postgresql://postgres:postgres@127.0.0.1:5432/pathos).
services:
  db:
    image: postgres:16
    container_name: pathos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pathos
    ports:
      - "5432:5432"
    volumes:
      - pathos-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pathos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pathos-pgdata:
