<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PATHOS Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          sans: ['Jost', 'system-ui', 'sans-serif'],
          serif: ['"Cormorant Garamond"', 'Georgia', 'serif'],
        },
        colors: {
          ink:     'rgb(var(--c-ink) / <alpha-value>)',
          mute:    'rgb(var(--c-mute) / <alpha-value>)',
          gold:    'rgb(var(--c-gold) / <alpha-value>)',
          sand:    'rgb(var(--c-sand) / <alpha-value>)',
          paper:   'rgb(var(--c-paper) / <alpha-value>)',
          sidebar: 'rgb(var(--c-side) / <alpha-value>)',
          sideink: 'rgb(var(--c-side-ink) / <alpha-value>)',
        },
      },
    },
  };
</script>
<style>
  :root {
    --c-app: 246 240 230;
    --c-paper: 255 253 248;
    --c-ink: 42 36 30;
    --c-mute: 156 142 124;
    --c-gold: 177 137 78;
    --c-sand: 236 226 210;
    --c-side: 42 36 30;
    --c-side-ink: 243 234 217;
  }
  html.dark {
    --c-app: 21 18 15;
    --c-paper: 38 33 28;
    --c-ink: 240 233 220;
    --c-mute: 160 147 129;
    --c-gold: 201 158 96;
    --c-sand: 58 50 42;
    --c-side: 16 13 11;
    --c-side-ink: 240 233 220;
  }
  html, body { background: rgb(var(--c-app)); }
  body { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 9px; height: 9px; }
  ::-webkit-scrollbar-thumb { background: rgb(var(--c-sand)); border-radius: 9px; }
</style>
<script>
  // apply saved theme before paint to avoid flash
  try { if (localStorage.getItem('pathos.theme') === 'dark') document.documentElement.classList.add('dark'); } catch (e) {}
</script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <rect width="100" height="100" fill="#2a241e"/>
    <g transform="translate(50 40)" fill="none" stroke="#b1894e" stroke-width="2.4" stroke-linejoin="round">
      <path d="M-13 -10 H13 L20 -1 L0 19 L-20 -1 Z"/>
      <path d="M-20 -1 H20 M-6 -10 L-10 -1 L0 19 M6 -10 L10 -1 L0 19" stroke-width="1.6"/>
    </g>
    <text x="50" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="11" letter-spacing="3" fill="#ece2d2">ADMIN</text>
  </svg>
</template>
<div id="root"></div>

<script src="pathos-store.js"></script>
<script type="text/babel" data-presets="react" src="admin/data.jsx"></script>
<script type="text/babel" data-presets="react" src="admin/views.jsx"></script>
<script type="text/babel" data-presets="react" src="admin/manage.jsx"></script>
<script type="text/babel" data-presets="react">
const NAV = [
  { id: 'dashboard',  label: 'Dashboard',  icon: Icon.grid },
  { id: 'orders',     label: 'Orders',     icon: Icon.bag, badge: 2 },
  { id: 'products',   label: 'Products',   icon: Icon.gem },
  { id: 'collections',label: 'Collections',icon: Icon.layers },
  { id: 'inventory',  label: 'Inventory',  icon: Icon.box },
  { id: 'deliveries', label: 'Deliveries', icon: Icon.truck },
  { id: 'customers',  label: 'Customers',  icon: Icon.users },
  { id: 'inbox',      label: 'Inbox',      icon: Icon.inbox },
  { id: 'discounts',  label: 'Discounts',  icon: Icon.tag },
  { id: 'analytics',  label: 'Analytics',  icon: Icon.chart },
];
const SITE_NAV = [
  { id: 'menu',        label: 'Storefront Menu',  icon: Icon.menu },
  { id: 'popups',      label: 'Popups & Banners', icon: Icon.mega },
  { id: 'seasons',     label: 'Seasonal Theme',   icon: Icon.sun },
  { id: 'subscribers', label: 'Subscribers',      icon: Icon.mail },
  { id: 'campaigns',   label: 'Newsletter',       icon: Icon.send },
];
const VIEWS = { dashboard: Dashboard, orders: Orders, products: Products, collections: Collections, inventory: Inventory, deliveries: Deliveries, customers: Customers, inbox: Inbox, discounts: Discounts, analytics: Analytics, menu: MenuManager, popups: Popups, seasons: Seasons, subscribers: Subscribers, campaigns: Campaigns, settings: Settings };

function Brand() {
  return (
    <div className="flex items-center gap-3 px-6 py-6">
      <svg width="26" height="21" viewBox="0 0 30 24" fill="none">
        <path d="M6 2 H24 L28 8 L15 22 L2 8 Z" stroke="#b1894e" strokeWidth="1.2" strokeLinejoin="round"/>
        <path d="M2 8 H28 M11 2 L8 8 L15 22 M19 2 L22 8 L15 22" stroke="#b1894e" strokeWidth="0.9"/>
      </svg>
      <div className="leading-none">
        <div className="font-serif text-[20px] font-semibold tracking-[0.18em] text-sideink">PATHOS</div>
        <div className="mt-0.5 text-[10px] font-light tracking-[0.2em] text-gold">ADMIN · BY YERALIS</div>
      </div>
    </div>
  );
}

function NavItem({ item, active, onClick }) {
  const A = item.icon;
  return (
    <button onClick={onClick}
      className={`group flex w-full items-center gap-3 rounded-lg px-3.5 py-2.5 text-[13.5px] font-medium tracking-wide transition-colors ${active ? 'bg-gold/15 text-gold' : 'text-sideink/70 hover:bg-white/5 hover:text-sideink'}`}>
      <A size={18} w={active ? 1.9 : 1.6} />
      <span className="flex-1 text-left">{item.label}</span>
      {item.badge && <span className="rounded-full bg-gold px-1.5 py-0.5 text-[10px] font-semibold text-white">{item.badge}</span>}
    </button>
  );
}

function Sidebar({ view, go, open, setOpen, unread }) {
  const withBadge = (n) => n.id === 'inbox' ? { ...n, badge: unread || undefined } : n;
  return (
    <>
      {open && <div className="fixed inset-0 z-30 bg-black/40 lg:hidden" onClick={() => setOpen(false)}></div>}
      <aside className={`fixed inset-y-0 left-0 z-40 flex w-64 flex-col bg-sidebar transition-transform lg:static lg:translate-x-0 ${open ? 'translate-x-0' : '-translate-x-full'}`}>
        <Brand />
        <nav className="flex-1 space-y-1 overflow-y-auto px-3 pb-4">
          <div className="px-3.5 pb-2 pt-1 text-[10px] font-semibold uppercase tracking-[0.16em] text-sideink/35">Manage</div>
          {NAV.map((n) => <NavItem key={n.id} item={withBadge(n)} active={view === n.id} onClick={() => { go(n.id); setOpen(false); }} />)}
          <div className="px-3.5 pb-2 pt-5 text-[10px] font-semibold uppercase tracking-[0.16em] text-sideink/35">Storefront</div>
          {SITE_NAV.map((n) => <NavItem key={n.id} item={n} active={view === n.id} onClick={() => { go(n.id); setOpen(false); }} />)}
          <div className="px-3.5 pb-2 pt-5 text-[10px] font-semibold uppercase tracking-[0.16em] text-sideink/35">Store</div>
          <NavItem item={{ id: 'settings', label: 'Settings', icon: Icon.gear }} active={view === 'settings'} onClick={() => { go('settings'); setOpen(false); }} />
        </nav>
        <div className="border-t border-white/8 px-4 py-4">
          <div className="flex items-center gap-3">
            <div className="flex h-9 w-9 items-center justify-center rounded-full bg-gold/20 text-[12px] font-semibold text-gold">YK</div>
            <div className="min-w-0 flex-1 leading-tight">
              <div className="truncate text-[12.5px] font-medium text-sideink">Yeralis K.</div>
              <div className="truncate text-[11px] text-sideink/45">Store owner</div>
            </div>
            <Icon.gear size={16} className="text-sideink/40" />
          </div>
        </div>
      </aside>
    </>
  );
}

function Topbar({ setOpen, dark, onToggleTheme }) {
  return (
    <header className="sticky top-0 z-20 flex items-center gap-4 border-b border-ink/10 bg-paper/85 px-5 py-3.5 backdrop-blur lg:px-8">
      <button onClick={() => setOpen(true)} className="rounded-lg p-1.5 text-ink/70 hover:bg-ink/5 lg:hidden">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div className="hidden items-center gap-2 rounded-lg border border-ink/12 bg-paper px-3 py-2 sm:flex sm:w-72">
        <Icon.search size={15} className="text-mute" />
        <input placeholder="Search orders, products, customers…" className="w-full bg-transparent text-[12.5px] text-ink placeholder:text-mute focus:outline-none" />
      </div>
      <div className="ml-auto flex items-center gap-1.5">
        <button onClick={onToggleTheme} title="Toggle theme" className="rounded-lg border border-ink/15 p-2 text-ink/75 hover:bg-ink/[0.04]">
          {dark ? <Icon.sun size={18}/> : <Icon.moon size={18}/>}
        </button>
        <a href="PATHOS by Yeralis.html" target="_blank" className="hidden items-center gap-1.5 whitespace-nowrap rounded-lg border border-ink/15 px-3 py-2 text-[12px] font-medium text-ink/75 hover:bg-ink/[0.04] sm:flex">View store <Icon.chevR size={13}/></a>
        <button className="relative rounded-lg p-2 text-ink/70 hover:bg-ink/5"><Icon.bell size={19}/><span className="absolute right-1.5 top-1.5 h-2 w-2 rounded-full bg-gold ring-2 ring-paper"></span></button>
        <div className="ml-1 flex h-8 w-8 items-center justify-center rounded-full bg-gold/15 text-[11px] font-semibold text-gold">YK</div>
      </div>
    </header>
  );
}

function App() {
  const [view, setView] = useState(() => (location.hash || '').replace('#', '') || 'dashboard');
  const [open, setOpen] = useState(false);
  const [dark, setDark] = useState(() => { try { return localStorage.getItem('pathos.theme') === 'dark'; } catch (e) { return false; } });
  const [unread, setUnread] = useState(() => PathosStore.load('messages').filter((m) => !m.read).length);
  const go = (v) => { setView(v); location.hash = v; };
  const toggleTheme = () => setDark((d) => {
    const next = !d;
    document.documentElement.classList.toggle('dark', next);
    try { localStorage.setItem('pathos.theme', next ? 'dark' : 'light'); } catch (e) {}
    return next;
  });
  useEffect(() => {
    const onHash = () => setView((location.hash || '').replace('#', '') || 'dashboard');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  useEffect(() => {
    const sync = () => setUnread(PathosStore.load('messages').filter((m) => !m.read).length);
    window.addEventListener('pathos-store', sync);
    window.addEventListener('storage', sync);
    return () => { window.removeEventListener('pathos-store', sync); window.removeEventListener('storage', sync); };
  }, []);
  useEffect(() => {
    const applySeason = () => {
      const sv = PathosStore.load('season');
      const key = PathosStore.effectiveSeason(sv);
      const seas = PathosStore.SEASONS[key];
      if (key && key !== 'none' && seas) document.documentElement.style.setProperty('--c-gold', seas.rgb);
      else document.documentElement.style.removeProperty('--c-gold');
    };
    applySeason();
    window.addEventListener('pathos-store', applySeason);
    window.addEventListener('storage', applySeason);
    return () => { window.removeEventListener('pathos-store', applySeason); window.removeEventListener('storage', applySeason); };
  }, []);
  const View = VIEWS[view] || Dashboard;
  return (
    <div className="flex min-h-screen text-ink">
      <Sidebar view={view} go={go} open={open} setOpen={setOpen} unread={unread} />
      <div className="flex min-w-0 flex-1 flex-col">
        <Topbar setOpen={setOpen} dark={dark} onToggleTheme={toggleTheme} />
        <main className="flex-1 px-5 py-7 lg:px-8 lg:py-9">
          <View go={go} />
        </main>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
