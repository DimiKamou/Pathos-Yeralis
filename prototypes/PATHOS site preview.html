  html, body { background: rgb(var(--c-app)); }
  body { -webkit-font-smoothing: antialiased; }
  /* hide scrollbar on the carousel track */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  /* ── Entry popup motion ── */
  @media (prefers-reduced-motion: no-preference) {
    @keyframes pathos-swing  { 0%,100% { transform: rotate(-3.5deg); } 50% { transform: rotate(3.5deg); } }
    @keyframes pathos-floatA { 0%,100% { transform: translateY(0) scale(.6) rotate(-6deg); } 50% { transform: translateY(-14px) scale(.6) rotate(2deg); } }
    @keyframes pathos-floatB { 0%,100% { transform: translateY(0) scale(.58) rotate(8deg); } 50% { transform: translateY(-10px) scale(.58) rotate(-3deg); } }
    @keyframes pathos-sheen  { 0% { transform: translateX(-180%) skewX(-16deg); } 60%,100% { transform: translateX(220%) skewX(-16deg); } }
    .pp-swing  { animation: pathos-swing 4.4s ease-in-out infinite; transform-origin: 50% 5px; }
    .pp-floatA { animation: pathos-floatA 7s ease-in-out infinite; }
    .pp-floatB { animation: pathos-floatB 8.6s ease-in-out infinite; }
    .pp-sheen  { animation: pathos-sheen 6s ease-in-out infinite; }
  }
  /* static fallback scale when motion is reduced */
  @media (prefers-reduced-motion: reduce) { .pp-floatA, .pp-floatB { transform: scale(.6); } }
  /* ── Static-preview banner (pinned above everything) ── */
  #preview-banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: 6px 40px 6px 16px;
    background: rgb(var(--c-ink)); color: rgb(var(--c-paper));
    font-family: 'Jost', system-ui, sans-serif;
    font-size: 11.5px; font-weight: 300; letter-spacing: 0.02em; line-height: 1.4;

<script>
  /* Apply the saved seasonal accent before paint (and keep it in sync across tabs). */
  (function () {
    function applySeason() {
      try {
        var s = JSON.parse(localStorage.getItem('pathos.season') || 'null') || {};
        var SEAS = window.PathosStore && PathosStore.SEASONS;
        var key = (window.PathosStore && PathosStore.effectiveSeason) ? PathosStore.effectiveSeason(s) : (s.key || 'none');
        if (key && key !== 'none' && SEAS && SEAS[key]) {
          document.documentElement.style.setProperty('--c-gold', SEAS[key].rgb);
        } else {
          document.documentElement.style.removeProperty('--c-gold');
        }
      } catch (e) {}
    }
    applySeason();
    window.addEventListener('storage', applySeason);
    window.addEventListener('pathos-store', applySeason);
  })();

/* ───────────────────────── Hash routing (client-side, file://-safe) ───────────────────────── */
const slugify = (s) => String(s).toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');

/* Distinct collections derived from the seed catalog (in first-seen order). "New In" is a
   virtual collection that lists every active product, so it's prepended explicitly. */
const ACTIVE = CATALOG.filter((p) => p.status === 'Active');
const COLLECTIONS = (() => {
  const seen = [];
  ACTIVE.forEach((p) => { if (p.collection && !seen.includes(p.collection)) seen.push(p.collection); });
  return ['New In', ...seen];
})();
const productsInCollection = (slug) =>
  slug === 'new-in' ? ACTIVE : ACTIVE.filter((p) => slugify(p.collection) === slug);
const collectionNameForSlug = (slug) => {
  if (slug === 'new-in') return 'New In';
  const hit = COLLECTIONS.find((c) => slugify(c) === slug);
  return hit || null;
};

/* Parse window.location.hash into { name, slug }. Supported:
   '' | '#/'                  → home
   '#/collections'            → collections index
   '#/collections/<slug>'     → single collection grid
   '#/shop'                   → all products
   '#/about'                  → about page                                          */
function parseRoute(hash) {
  const raw = (hash || '').replace(/^#/, '');
  const path = raw.replace(/^\/+/, '').replace(/\/+$/, '');     // trim leading/trailing slashes
  if (!path) return { name: 'home' };
  const seg = path.split('/');
  if (seg[0] === 'collections') {
    return seg[1] ? { name: 'collection', slug: seg[1] } : { name: 'collections' };
  }
  if (seg[0] === 'shop') return { name: 'shop' };
  if (seg[0] === 'about') return { name: 'about' };
  return { name: 'home' };                                       // unknown → home
}
function useHashRoute() {
  const [route, setRoute] = useState(() => parseRoute(window.location.hash));
  useEffect(() => {
    const onHash = () => { setRoute(parseRoute(window.location.hash)); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);
  return route;
}
function variantsFor(art) {
  if (art === 'necklace') return { label: 'Length', opts: ['40 cm', '45 cm', '50 cm'] };
  if (art === 'ring') return { label: 'Ring size', opts: ['50', '52', '54', '56'] };
  if (art === 'bracelet') return { label: 'Size', opts: ['S', 'M', 'L'] };

}
function ArtBox({ k, box = 'h-14 w-14', scale = 'scale-[0.42]' }) {

function ShopProvider({ children }) {
  const [items, setItems] = useState(() => { try { return JSON.parse(localStorage.getItem('pathos.cart') || '[]'); } catch (e) { return []; } });
  const [pdp, setPdp] = useState(null);
  const [cartOpen, setCartOpen] = useState(false);
  const [checkout, setCheckout] = useState(false);
  const [wish, setWish] = useState(() => { try { return JSON.parse(localStorage.getItem('pathos.wishlist') || '[]'); } catch (e) { return []; } });
  const [wishOpen, setWishOpen] = useState(false);
  const [discount, setDiscount] = useState(null);
  const [query, setQuery] = useState('');
  useEffect(() => { try { localStorage.setItem('pathos.cart', JSON.stringify(items)); } catch (e) {} }, [items]);
  useEffect(() => { try { localStorage.setItem('pathos.wishlist', JSON.stringify(wish)); } catch (e) {} }, [wish]);
  const add = (p, variant, qty = 1) => setItems((prev) => {
    const key = p.id + '|' + (variant || '');
    const i = prev.findIndex((x) => x.key === key);
    if (i >= 0) { const n = prev.slice(); n[i] = { ...n[i], qty: n[i].qty + qty }; return n; }
    return [...prev, { key, id: p.id, name: p.name, art: p.art, price: p.price, variant: variant || '', qty }];
  });
  const setQty = (key, qty) => setItems((prev) => qty <= 0 ? prev.filter((x) => x.key !== key) : prev.map((x) => x.key === key ? { ...x, qty } : x));
  const remove = (key) => setItems((prev) => prev.filter((x) => x.key !== key));
  const clear = () => { setItems([]); setDiscount(null); };
  const count = items.reduce((s, x) => s + x.qty, 0);
  const subtotal = items.reduce((s, x) => s + x.price * x.qty, 0);
  // wishlist
  const toggleWish = (id) => setWish((prev) => prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]);
  const inWish = (id) => wish.includes(id);
  const wishCount = wish.length;
  // discount
  const applyDiscount = (code) => { const d = PathosStore.checkDiscount(code); if (d) setDiscount(d); return d; };
  const clearDiscount = () => setDiscount(null);
  const discountAmount = discount ? +(subtotal * discount.pct).toFixed(2) : 0;
  const freeShipCode = !!(discount && discount.freeShip);
  return <ShopCtx.Provider value={{ items, add, setQty, remove, clear, count, subtotal, pdp, setPdp, cartOpen, setCartOpen, checkout, setCheckout, wish, wishOpen, setWishOpen, toggleWish, inWish, wishCount, discount, applyDiscount, clearDiscount, discountAmount, freeShipCode, query, setQuery }}>{children}</ShopCtx.Provider>;
}

/* ───────────────────────── Top bar ───────────────────────── */
function ThemeToggle() {
  const [dark, setDark] = useState(() => { try { return localStorage.getItem('pathos.theme') === 'dark'; } catch (e) { return false; } });
  const toggle = () => setDark((d) => {
    const next = !d;
    document.documentElement.classList.toggle('dark', next);
    try { localStorage.setItem('pathos.theme', next ? 'dark' : 'light'); } catch (e) {}
    return next;
  });
  return (
    <button onClick={toggle} aria-label="Toggle theme" className="p-1 text-ink/80 hover:text-ink transition-colors">
      {dark ? <SunIcon size={19} /> : <MoonIcon size={19} />}
    </button>
  );
}
function IconBadge({ children, count, onClick }) {
  return (
    <button onClick={onClick} className="relative p-1 text-ink/80 hover:text-ink transition-colors">

      {count != null && count > 0 && (

/* ───────────────────────── Nav + dropdown ───────────────────────── */
/* Dropdown links are derived from the real catalog so every entry resolves to a page. */
const COLLECTION_LINKS = COLLECTIONS;

/* Map a menu item to its hash route. System items are keyed by id; otherwise fall back by label. */
function menuHref(m) {
  if (m.type === 'collections') return '#/collections';
  if (m.id === 'jewelry' || /jewelry|accessories/i.test(m.label)) return '#/shop';
  if (m.id === 'about' || /about/i.test(m.label)) return '#/about';
  return '#/';
}

function Nav() {
  const [open, setOpen] = useState(false);
  const [menu, setMenu] = useState(() => PathosStore.load('menu'));
  useEffect(() => {
    const sync = () => setMenu(PathosStore.load('menu'));
    window.addEventListener('pathos-store', sync);
    window.addEventListener('storage', sync);
    return () => { window.removeEventListener('pathos-store', sync); window.removeEventListener('storage', sync); };
  }, []);
  const linkCls = 'text-[12px] tracking-[0.22em] text-ink/85 hover:text-ink transition-colors';
  const items = menu.filter((m) => m.enabled);
  return (
    <nav className="border-t border-ink/10">
      <div className="mx-auto flex max-w-[1240px] flex-wrap items-center justify-center gap-x-12 gap-y-3 px-8 py-4">
        {items.map((m) => (
          m.type === 'collections' ? (
            <div key={m.id} className="relative" onMouseEnter={() => setOpen(true)} onMouseLeave={() => setOpen(false)}>
              <a href="#/collections" className={linkCls + ' flex items-center gap-1.5 uppercase'} onClick={() => setOpen(false)}>{m.label}</a>
              {open && (
                <div className="absolute left-1/2 top-[calc(100%+16px)] z-30 w-56 -translate-x-1/2 border border-ink/12 bg-paper py-3 shadow-[0_18px_50px_-24px_rgba(80,60,30,0.35)]">
                  <ul className="flex flex-col">
                    {COLLECTION_LINKS.map((l) => (
                      <li key={l}><a href={'#/collections/' + slugify(l)} onClick={() => setOpen(false)} className="block px-6 py-[9px] text-[12.5px] font-light tracking-[0.06em] text-steel hover:bg-ink/[0.03] hover:text-ink/80 transition-colors">{l}</a></li>
                    ))}
                  </ul>
                </div>
              )}
            </div>
          ) : (
            <a key={m.id} href={menuHref(m)} className={linkCls + ' flex items-center gap-1.5 uppercase'}>
              {m.type === 'sale' && <span className="h-1.5 w-1.5 rounded-full bg-gold"></span>}
              {m.label}
            </a>
          )
        ))}
      </div>
    </nav>
  );
}

function AnnouncementBar() {
  const [a, setA] = useState(() => PathosStore.load('announcement'));
  const [s, setS] = useState(() => PathosStore.load('season'));
  useEffect(() => {
    const sync = () => { setA(PathosStore.load('announcement')); setS(PathosStore.load('season')); };
    window.addEventListener('pathos-store', sync);
    window.addEventListener('storage', sync);
    return () => { window.removeEventListener('pathos-store', sync); window.removeEventListener('storage', sync); };
  }, []);
  const season = PathosStore.SEASONS[PathosStore.effectiveSeason(s)] || PathosStore.SEASONS.none;
  const active = PathosStore.effectiveSeason(s) !== 'none';
  const text = (active && s.useGreeting && season.greeting) ? season.greeting : (a.enabled ? a.text : '');
  if (!text) return null;
  const motif = active ? <span className="opacity-80" dangerouslySetInnerHTML={{ __html: PathosStore.seasonMotif(season.motif, 13, 'currentColor') }} /> : null;
  return (
    <div className="flex items-center justify-center gap-3 bg-[#2a241e] px-4 py-2.5 text-center text-[11px] font-medium leading-snug tracking-[0.18em] text-[#f3ead9]">
      {motif}<span>{text}</span>{motif}
    </div>
  );
}

/* ───────────────────────── Entry popup (admin-controlled) ───────────────────────── */
function EntryPopup() {
  const [p] = useState(() => PathosStore.load('popup'));
  const [show, setShow] = useState(false);
  const [entered, setEntered] = useState(false);
  const [copied, setCopied] = useState(false);
  useEffect(() => {
    if (!p.enabled) return;
    if (p.frequency === 'session' && sessionStorage.getItem('pathos.popupSeen')) return;
    const t = setTimeout(() => setShow(true), Math.max(0, (p.delay || 0) * 1000));
    return () => clearTimeout(t);
  }, []);
  useEffect(() => { if (show) { const r = setTimeout(() => setEntered(true), 30); return () => clearTimeout(r); } }, [show]);
  const close = () => { setShow(false); try { sessionStorage.setItem('pathos.popupSeen', '1'); } catch (e) {} };
  const copy = () => { try { navigator.clipboard.writeText(p.code); } catch (e) {} setCopied(true); };
  if (!show) return null;
  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-5">
      <div className={`absolute inset-0 bg-black/55 backdrop-blur-[2px] transition-opacity duration-300 ${entered ? 'opacity-100' : 'opacity-0'}`} onClick={close}></div>
      <div className={`relative w-full max-w-md overflow-hidden rounded-[20px] bg-[#2a241e] p-9 text-center shadow-2xl ring-1 ring-gold/15 transition-all duration-500 ease-[cubic-bezier(.16,.84,.44,1)] motion-reduce:transition-none ${entered ? 'opacity-100 translate-y-0 scale-100' : 'translate-y-4 scale-95 opacity-0'}`}>
        {/* layered ambience */}
        <div className="pointer-events-none absolute inset-0 opacity-25" style={{ background: 'radial-gradient(125% 85% at 50% -5%, rgba(201,158,96,.6), transparent 62%)' }}></div>
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          <div className="pp-sheen absolute -inset-y-6 left-0 w-1/3" style={{ background: 'linear-gradient(90deg, transparent, rgba(201,158,96,.13), transparent)' }}></div>
        </div>
        {/* drifting line-art jewelry */}
        <div className="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
          <div className="pp-floatA absolute -left-10 top-6 opacity-[0.13]">{Art.ring}</div>
          <div className="pp-floatB absolute -right-12 top-1 opacity-[0.12]">{Art.drop}</div>
          <div className="pp-floatA absolute -right-8 -bottom-4 opacity-[0.11]" style={{ animationDelay: '1.6s' }}>{Art.shell}</div>
          <div className="pp-floatB absolute -left-8 -bottom-6 opacity-[0.10]" style={{ animationDelay: '2.4s' }}>{Art.bracelet}</div>
        </div>

        <button onClick={close} className="absolute right-4 top-4 z-10 text-[#f3ead9]/50 hover:text-[#f3ead9]" aria-label="Close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>

        <div className="relative">
          <div className="text-[10px] font-medium uppercase tracking-[0.34em] text-gold">PATHOS · by Yeralis</div>
          <div className="mx-auto mt-3 mb-1 flex items-center justify-center gap-2 text-gold/70">
            <span className="h-px w-9 bg-gold/35"></span>
            <span className="text-[7px] leading-none">◆</span>
            <span className="h-px w-9 bg-gold/35"></span>
          </div>
          <h3 className="font-serif text-[32px] font-medium leading-tight text-[#f3ead9]">{p.heading}</h3>
          <p className="mx-auto mt-3 max-w-xs text-[13.5px] font-light leading-relaxed text-[#f3ead9]/75">{p.message}</p>

          {p.code && (
            <div className="relative mx-auto mt-7 w-fit">
              {/* jump ring the tag hangs from */}
              <div className="mx-auto h-3.5 w-3.5 rounded-full border-[1.5px] border-gold/80"></div>
              <button onClick={copy} title="Tap to copy"
                className="pp-swing group relative -mt-[3px] block px-10 pb-4 pt-5 shadow-[0_12px_24px_-12px_rgba(0,0,0,.7)] transition-transform active:scale-[.98]"
                style={{ background: 'linear-gradient(155deg,#f3ead9,#e2d4ba)', clipPath: 'polygon(50% 0, 100% 14%, 100% 100%, 0 100%, 0 14%)' }}>
                {/* punched hole showing the dark card behind */}
                <span className="absolute left-1/2 top-[9px] h-2.5 w-2.5 -translate-x-1/2 rounded-full bg-[#2a241e] ring-1 ring-black/20"></span>
                <span className="mt-3 block text-[9px] font-semibold uppercase tracking-[0.3em] text-[#9a7b46]">Welcome gift</span>
                <span className="mt-1.5 block font-mono text-[20px] font-medium tracking-[0.26em] text-[#2a241e]">{copied ? 'Copied ✓' : p.code}</span>
                <span className="mt-1 block text-[9px] uppercase tracking-[0.18em] text-[#2a241e]/45">{copied ? 'applied at checkout' : 'tap to copy'}</span>
              </button>
            </div>
          )}

          <button onClick={close} className="mt-7 whitespace-nowrap rounded-full bg-gold px-9 py-3 text-[12.5px] font-medium tracking-wide text-white shadow-lg shadow-gold/20 transition-colors hover:bg-gold/90">{p.button}</button>
          <button onClick={close} className="mt-3 block w-full text-[11px] tracking-wide text-[#f3ead9]/45 hover:text-[#f3ead9]/70">No thanks</button>
        </div>
      </div>
    </div>
  );
}

/* ───────────────────────── Chat widget (questions → admin inbox) ───────────────────────── */
function ChatWidget() {
  const [open, setOpen] = useState(false);
  const [sent, setSent] = useState(false);
  const [form, setForm] = useState({ name: '', email: '', topic: 'General', message: '' });
  const set = (k, v) => setForm((f) => ({ ...f, [k]: v }));
  const submit = () => {
    if (!form.email.includes('@') || form.message.trim().length < 2) return;
    PathosStore.pushMessage(form);
    setSent(true);
  };
  const reset = () => { setForm({ name: '', email: '', topic: 'General', message: '' }); setSent(false); };
  const field = 'w-full rounded-lg border border-ink/15 bg-paper px-3 py-2.5 text-[13px] text-ink placeholder:text-mute focus:border-gold focus:outline-none';
  return (
    <div className="fixed bottom-5 right-5 z-40 flex flex-col items-end gap-3">
      {open && (
        <div className="w-[330px] max-w-[calc(100vw-2.5rem)] overflow-hidden rounded-2xl border border-ink/10 bg-paper shadow-[0_24px_60px_-20px_rgba(40,30,15,0.45)]">
          <div className="flex items-center justify-between bg-[#2a241e] px-5 py-4">
            <div>
              <div className="font-serif text-[17px] font-medium text-[#f3ead9]">Questions? Ask us</div>
              <div className="mt-0.5 text-[11px] font-light text-[#e9dcc6]/65">We reply by email within 24 hours.</div>
            </div>
            <button onClick={() => setOpen(false)} className="text-[#f3ead9]/55 hover:text-[#f3ead9]" aria-label="Close chat"><CloseIcon size={18} /></button>
          </div>
          {sent ? (
            <div className="px-5 py-8 text-center">
              <div className="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-gold/15 text-gold"><MailIcon size={22} /></div>
              <div className="font-serif text-[20px] font-medium text-ink">Message sent</div>
              <p className="mx-auto mt-2 max-w-[16rem] text-[13px] font-light leading-relaxed text-mute">Thanks{form.name ? ', ' + form.name.split(' ')[0] : ''}! We've logged your question and a copy has gone to our team — we'll reply to <span className="text-ink">{form.email}</span> shortly.</p>
              <button onClick={reset} className="mt-5 text-[12px] font-medium uppercase tracking-[0.16em] text-gold hover:text-ink">Ask another →</button>
            </div>
          ) : (
            <div className="space-y-3 p-5">
              <div className="grid grid-cols-2 gap-3">
                <input className={field} placeholder="Name" value={form.name} onChange={(e) => set('name', e.target.value)} />
                <select className={field} value={form.topic} onChange={(e) => set('topic', e.target.value)}>
                  {['General', 'Order', 'Sizing', 'Custom piece', 'Wholesale'].map((t) => <option key={t}>{t}</option>)}
                </select>
              </div>
              <input className={field} placeholder="Email *" value={form.email} onChange={(e) => set('email', e.target.value)} />
              <textarea className={field + ' resize-none'} rows={3} placeholder="How can we help? *" value={form.message} onChange={(e) => set('message', e.target.value)}></textarea>
              <button onClick={submit} className="flex w-full items-center justify-center gap-2 whitespace-nowrap rounded-lg bg-gold py-2.5 text-[12.5px] font-medium tracking-wide text-white transition-colors hover:bg-gold/90"><SendIcon size={15} />Send message</button>
              <p className="text-center text-[11px] font-light text-mute">Prefer email? <a href="mailto:hello@pathos-jewelry.com" className="text-gold hover:underline">hello@pathos-jewelry.com</a></p>
            </div>
          )}
        </div>
      )}
      <button onClick={() => setOpen((v) => !v)} aria-label="Open chat"
        className="flex h-14 w-14 items-center justify-center rounded-full bg-gold text-white shadow-[0_12px_30px_-8px_rgba(177,137,78,0.7)] transition-transform hover:scale-105">
        {open ? <CloseIcon size={22} /> : <ChatIcon size={24} />}
      </button>
    </div>
  );
}

              <div className="mt-6 flex items-center gap-5">
                <div className="flex items-center rounded-full border border-ink/20">
                  <button onClick={() => setQty((q) => Math.max(1, q - 1))} className="px-3 py-1.5 text-ink/70 hover:text-ink">−</button>
                  <span className="w-8 text-center text-[13px] text-ink">{qty}</span>

/* ───────────────────────── Discount code field (shared) ───────────────────────── */
function DiscountField({ dark }) {
  const { discount, applyDiscount, clearDiscount } = useShop();
  const [code, setCode] = useState('');
  const [err, setErr] = useState('');
  const apply = () => { if (!code.trim()) return; const d = applyDiscount(code); if (!d) setErr('That code isn\u2019t valid'); else { setErr(''); setCode(''); } };
  if (discount) {
    return (
      <div className="flex items-center justify-between rounded-lg bg-gold/12 px-3 py-2.5 text-[12.5px]">
        <span className="flex items-center gap-2 text-ink"><span className="rounded bg-gold/20 px-1.5 py-0.5 font-mono text-[11px] tracking-wide text-gold">{discount.code}</span>{discount.label} applied</span>
        <button onClick={clearDiscount} className="text-[11.5px] text-mute hover:text-ink">Remove</button>
      </div>
    );
  }
  const inputCls = `w-full rounded-lg border px-3 py-2.5 text-[13px] uppercase tracking-wide placeholder:normal-case placeholder:tracking-normal focus:outline-none ${dark ? 'border-[#f3ead9]/25 bg-transparent text-[#f3ead9] placeholder:text-[#e9dcc6]/40 focus:border-gold' : 'border-ink/15 bg-paper text-ink placeholder:text-mute focus:border-gold'}`;
  return (
    <div>
      <div className="flex gap-2">
        <input value={code} onChange={(e) => { setCode(e.target.value); setErr(''); }} onKeyDown={(e) => e.key === 'Enter' && apply()} placeholder="Discount code" className={inputCls} />
        <button onClick={apply} className="shrink-0 rounded-lg border border-ink/20 px-4 text-[12px] font-medium uppercase tracking-[0.12em] text-ink/80 transition-colors hover:border-ink hover:text-ink">Apply</button>
      </div>
      {err && <div className="mt-1.5 text-[11px] text-rose-500">{err}</div>}
    </div>
  );
}

          <button onClick={() => setCartOpen(false)} className="rounded-lg p-2 text-mute hover:bg-ink/5 hover:text-ink"><CloseIcon size={18} /></button>
        </div>
        {items.length === 0 ? (
          <div className="flex flex-1 flex-col items-center justify-center px-6 text-center">
            <div className="mb-4 text-mute"><BagIcon size={40} /></div>
            <div className="font-serif text-[20px] text-ink">Your bag is empty</div>
            <p className="mt-2 text-[13px] font-light text-mute">Discover handmade pieces from the Aegean.</p>
            <button onClick={() => setCartOpen(false)} className="mt-5 rounded-full bg-ink px-6 py-2.5 text-[12px] font-medium uppercase tracking-[0.16em] text-paper hover:bg-ink/90">Continue shopping</button>
          </div>
        ) : (
          <>
            <div className="flex-1 divide-y divide-ink/8 overflow-y-auto px-6">
              {items.map((it) => (
                <div key={it.key} className="flex gap-4 py-4">
                  <ArtBox k={it.art} box="h-16 w-16" scale="scale-[0.48]" />
                  <div className="min-w-0 flex-1">
                    <div className="flex justify-between gap-3">
                      <span className="text-[13.5px] font-medium text-ink">{it.name}</span>
                      <span className="text-[13px] text-ink">{eur(it.price * it.qty)}</span>
                    </div>
                    {it.variant && <div className="mt-0.5 text-[11.5px] text-mute">{it.variant}</div>}
                    <div className="mt-2 flex items-center justify-between">
                      <div className="flex items-center rounded-full border border-ink/20">
                        <button onClick={() => setQty(it.key, it.qty - 1)} className="px-2.5 py-1 text-ink/70 hover:text-ink">−</button>
                        <span className="w-7 text-center text-[12px] text-ink">{it.qty}</span>
                        <button onClick={() => setQty(it.key, it.qty + 1)} className="px-2.5 py-1 text-ink/70 hover:text-ink">+</button>
                      </div>
                      <button onClick={() => remove(it.key)} className="text-[11.5px] text-mute hover:text-rose-500">Remove</button>
                    </div>
                  </div>
                </div>
              ))}
            </div>
            <div className="border-t border-ink/10 px-6 py-5">
              <div className="mb-4"><DiscountField /></div>
              <div className="flex justify-between text-[13px] text-mute"><span>Subtotal</span><span className="text-ink">{eur(subtotal)}</span></div>
              {discount && discountAmount > 0 && <div className="mt-1 flex justify-between text-[13px] text-gold"><span>Discount ({discount.code})</span><span>−{eur(discountAmount)}</span></div>}
              <div className="mt-1 flex justify-between text-[12px] text-mute"><span>Shipping</span><span>{(subtotal >= 100 || freeShipCode) ? 'Free' : 'Calculated at checkout'}</span></div>
              <button onClick={() => { setCartOpen(false); setCheckout(true); }} className="mt-4 w-full rounded-full bg-gold py-3.5 text-[12.5px] font-medium uppercase tracking-[0.16em] text-white transition-colors hover:bg-gold/90">Checkout · {eur(total)}</button>
              <button onClick={() => setCartOpen(false)} className="mt-2 w-full text-[11.5px] tracking-wide text-mute hover:text-ink">Continue shopping</button>
            </div>
          </>
        )}
      </aside>
    </div>
  );
}

/* ───────────────────────── Checkout ───────────────────────── */
const COUNTRY_CODE = { Greece: 'GR', Germany: 'DE', France: 'FR', Italy: 'IT', Ireland: 'IE', Netherlands: 'NL', Spain: 'ES', Portugal: 'PT' };
function Checkout() {
  const { checkout, setCheckout, items, subtotal, clear, discount, discountAmount, freeShipCode } = useShop();
  const [step, setStep] = useState(0);
  const [info, setInfo] = useState({ name: '', email: '', address: '', city: '', zip: '', country: 'Greece' });
  const [card, setCard] = useState({ num: '', exp: '', cvc: '' });
  const [method, setMethod] = useState('card');
  const [order, setOrder] = useState(null);
  const [copied, setCopied] = useState(false);
  useEffect(() => { if (checkout) { setStep(0); setOrder(null); setMethod('card'); } }, [checkout]);
  if (!checkout) return null;
  const BANK = PathosStore.BANK;
  const PAY = {
    card:   { status: 'Paid', label: 'Card' },
    apple:  { status: 'Paid', label: 'Apple Pay' },
    google: { status: 'Paid', label: 'Google Pay' },
    bank:   { status: 'Awaiting payment', label: 'Bank transfer' },
  };
  const set = (k, v) => setInfo((s) => ({ ...s, [k]: v }));
  const setC = (k, v) => setCard((s) => ({ ...s, [k]: v }));
  const f = 'w-full rounded-lg border border-ink/15 bg-paper px-3 py-2.5 text-[13.5px] text-ink placeholder:text-mute focus:border-gold focus:outline-none';
  const shipping = (subtotal >= 100 || freeShipCode) ? 0 : 5;
  const total = Math.max(0, subtotal - discountAmount) + shipping;
  const step0Ok = info.name && info.email.includes('@') && info.address && info.city;
  const step1Ok = method === 'card' ? (card.num.replace(/\s/g, '').length >= 12 && card.exp && card.cvc.length >= 3) : true;
  const pay = PAY[method];
  const place = () => {
    const o = PathosStore.pushOrder({
      customer: info.name || 'Guest', email: info.email, country: COUNTRY_CODE[info.country] || 'GR',
      date: new Date().toLocaleDateString('en-IE', { day: 'numeric', month: 'short', year: 'numeric' }),
      items: items.reduce((s, x) => s + x.qty, 0), total,
      payment: pay.status, method: pay.label,
      discount: discount ? { code: discount.code, pct: discount.pct, amount: discountAmount } : null,
      lines: items.map((x) => ({ k: x.art, name: x.name + (x.variant ? ' · ' + x.variant : ''), qty: x.qty, price: x.price })),
    });
    if (info.email.includes('@')) PathosStore.pushSubscriber({ email: info.email, source: 'Checkout' });
    setOrder(o); clear();
  };
  const copyIban = () => { try { navigator.clipboard.writeText(BANK.iban.replace(/\s/g, '')); } catch (e) {} setCopied(true); setTimeout(() => setCopied(false), 1800); };
  const MethodRow = ({ id, icon, title, sub }) => (
    <button onClick={() => setMethod(id)} className={`flex w-full items-center gap-3 rounded-xl border px-4 py-3 text-left transition-colors ${method === id ? 'border-gold bg-gold/[0.06]' : 'border-ink/15 hover:border-ink/30'}`}>
      <span className={method === id ? 'text-gold' : 'text-mute'}>{icon}</span>
      <span className="flex-1"><span className="block text-[13px] font-medium text-ink">{title}</span>{sub && <span className="block text-[11.5px] font-light text-mute">{sub}</span>}</span>
      <span className={`flex h-4 w-4 items-center justify-center rounded-full border ${method === id ? 'border-gold' : 'border-ink/25'}`}>{method === id && <span className="h-2 w-2 rounded-full bg-gold" />}</span>
    </button>
  );
  const Step = ({ n, label }) => (
    <div className="flex items-center gap-2">
      <span className={`flex h-6 w-6 items-center justify-center rounded-full text-[11px] font-semibold ${step >= n ? 'bg-gold text-white' : 'bg-ink/10 text-mute'}`}>{n + 1}</span>
      <span className={`text-[11px] font-medium uppercase tracking-[0.14em] ${step >= n ? 'text-ink' : 'text-mute'}`}>{label}</span>
    </div>
  );
  return (
    <div className="fixed inset-0 z-[60] flex items-center justify-center p-5">
      <div className="absolute inset-0 bg-black/60 backdrop-blur-[2px]" onClick={() => setCheckout(false)}></div>
      <div className="relative flex max-h-[90vh] w-full max-w-lg flex-col overflow-hidden rounded-2xl bg-paper shadow-2xl">
        <div className="flex items-center justify-between border-b border-ink/10 px-6 py-5">
          <h3 className="font-serif text-[22px] font-medium text-ink">{order ? <span className="whitespace-nowrap">Order confirmed</span> : 'Checkout'}</h3>
          <button onClick={() => setCheckout(false)} className="rounded-lg p-2 text-mute hover:bg-ink/5 hover:text-ink"><CloseIcon size={18} /></button>
        </div>

        {order ? (
          order.payment === 'Awaiting payment' ? (
            <div className="px-7 py-9 text-center">
              <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gold/15 text-gold"><BankIcon size={28} /></div>
              <div className="font-serif text-[26px] font-medium text-ink">Almost there{info.name ? ', ' + info.name.split(' ')[0] : ''}!</div>
              <p className="mx-auto mt-3 max-w-sm text-[13.5px] font-light leading-relaxed text-mute">Order <span className="font-medium text-ink">{order.id}</span> is reserved. Transfer <span className="font-medium text-ink">{eur(order.total)}</span> to the account below using <span className="font-medium text-ink">{order.id}</span> as the reference — we ship the moment it clears.</p>
              <div className="mx-auto mt-5 max-w-xs space-y-1.5 rounded-xl border border-ink/12 bg-sand/30 p-4 text-left text-[12.5px] text-ink">
                <div className="flex justify-between gap-3"><span className="text-mute">IBAN</span><span className="font-mono">{BANK.iban}</span></div>
                <div className="flex justify-between gap-3"><span className="text-mute">BIC</span><span className="font-mono">{BANK.bic}</span></div>
                <div className="flex justify-between gap-3"><span className="text-mute">Reference</span><span className="font-medium">{order.id}</span></div>
              </div>
              <button onClick={() => setCheckout(false)} className="mt-7 rounded-full bg-ink px-7 py-3 text-[12px] font-medium uppercase tracking-[0.16em] text-paper hover:bg-ink/90">Done</button>
            </div>
          ) : (
          <div className="px-7 py-10 text-center">
            <div className="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-full bg-gold/15 text-gold"><CheckBig /></div>
            <div className="font-serif text-[26px] font-medium text-ink">Thank you{info.name ? ', ' + info.name.split(' ')[0] : ''}!</div>
            <p className="mx-auto mt-3 max-w-xs text-[13.5px] font-light leading-relaxed text-mute">Your order <span className="font-medium text-ink">{order.id}</span> is confirmed. We've emailed a receipt to <span className="text-ink">{info.email}</span> and will let you know when it ships.</p>
            <button onClick={() => setCheckout(false)} className="mt-7 rounded-full bg-ink px-7 py-3 text-[12px] font-medium uppercase tracking-[0.16em] text-paper hover:bg-ink/90">Continue shopping</button>
          </div>
          )
        ) : (
          <>
            <div className="flex items-center justify-between gap-2 border-b border-ink/8 px-6 py-4">
              <Step n={0} label="Details" /><span className="h-px flex-1 bg-ink/10" /><Step n={1} label="Payment" /><span className="h-px flex-1 bg-ink/10" /><Step n={2} label="Review" />
            </div>
            <div className="flex-1 space-y-3 overflow-y-auto px-6 py-6">
              {step === 0 && (<>
                <input className={f} placeholder="Full name" value={info.name} onChange={(e) => set('name', e.target.value)} />
                <input className={f} placeholder="Email" value={info.email} onChange={(e) => set('email', e.target.value)} />
                <input className={f} placeholder="Address" value={info.address} onChange={(e) => set('address', e.target.value)} />
                <div className="grid grid-cols-2 gap-3">
                  <input className={f} placeholder="City" value={info.city} onChange={(e) => set('city', e.target.value)} />
                  <input className={f} placeholder="Postcode" value={info.zip} onChange={(e) => set('zip', e.target.value)} />
                </div>
                <select className={f} value={info.country} onChange={(e) => set('country', e.target.value)}>{Object.keys(COUNTRY_CODE).map((c) => <option key={c}>{c}</option>)}</select>
              </>)}
              {step === 1 && (<>
                <div className="rounded-lg bg-sand/40 p-3 text-[11.5px] font-light text-mute">Demo checkout — no real payment is processed.</div>
                {/* express pay */}
                <div className="grid grid-cols-2 gap-3">
                  <button onClick={() => setMethod('apple')} className={`flex items-center justify-center gap-1.5 rounded-lg py-3 text-[14px] font-medium transition ${method === 'apple' ? 'bg-black text-white ring-2 ring-gold ring-offset-2' : 'bg-black text-white hover:opacity-90'}`}><AppleMark size={17} className="-mt-0.5" /> Pay</button>
                  <button onClick={() => setMethod('google')} className={`flex items-center justify-center gap-1.5 rounded-lg border py-3 text-[14px] font-medium text-ink transition ${method === 'google' ? 'border-gold ring-2 ring-gold ring-offset-2' : 'border-ink/20 hover:border-ink/40'}`}><GoogleG size={18} /> Pay</button>
                </div>
                <div className="flex items-center gap-3 py-1 text-[11px] uppercase tracking-[0.16em] text-mute"><span className="h-px flex-1 bg-ink/10" />or pay another way<span className="h-px flex-1 bg-ink/10" /></div>
                {/* method picker */}
                <div className="space-y-2.5">
                  <MethodRow id="card" icon={<CardIcon size={20} />} title="Credit / debit card" sub="Visa · Mastercard · Maestro" />
                  <MethodRow id="bank" icon={<BankIcon size={20} />} title="Bank transfer / deposit" sub="Pay by IBAN — ships once it clears" />
                </div>
                {(method === 'card' || method === 'apple' || method === 'google') && (
                  <div className="space-y-3 pt-1">
                    {method === 'card' && (<>
                      <input className={f} placeholder="Card number" value={card.num} onChange={(e) => setC('num', e.target.value)} />
                      <div className="grid grid-cols-2 gap-3">
                        <input className={f} placeholder="MM / YY" value={card.exp} onChange={(e) => setC('exp', e.target.value)} />
                        <input className={f} placeholder="CVC" value={card.cvc} onChange={(e) => setC('cvc', e.target.value)} />
                      </div>
                    </>)}
                    {(method === 'apple' || method === 'google') && (
                      <div className="rounded-lg border border-ink/12 bg-sand/30 px-4 py-3 text-[12.5px] font-light leading-relaxed text-mute">You'll confirm securely with {method === 'apple' ? 'Apple Pay' : 'Google Pay'} when you place the order — no card details entered here.</div>
                    )}
                    <div className="flex items-center justify-center gap-1.5 text-[11px] font-light text-mute"><LockIcon size={13} className="text-gold" /> Encrypted & secure · we never store card numbers</div>
                  </div>
                )}
                {method === 'bank' && (
                  <div className="space-y-2 rounded-xl border border-ink/12 bg-sand/30 p-4">
                    <div className="text-[11px] font-medium uppercase tracking-[0.14em] text-mute">Transfer the total to</div>
                    <div className="space-y-1.5 text-[13px] text-ink">
                      <div className="flex justify-between gap-3"><span className="text-mute">Beneficiary</span><span className="text-right">{BANK.beneficiary}</span></div>
                      <div className="flex justify-between gap-3"><span className="text-mute">Bank</span><span>{BANK.bank}</span></div>
                      <div className="flex items-center justify-between gap-3">
                        <span className="text-mute">IBAN</span>
                        <button onClick={copyIban} className="flex items-center gap-1.5 font-mono text-[12.5px] text-ink hover:text-gold">{BANK.iban} <CopyIcon size={13} />{copied && <span className="text-[10px] not-italic text-gold">copied</span>}</button>
                      </div>
                      <div className="flex justify-between gap-3"><span className="text-mute">BIC</span><span className="font-mono">{BANK.bic}</span></div>
                    </div>
                    <p className="pt-1 text-[11.5px] font-light leading-relaxed text-mute">{BANK.note}</p>
                  </div>
                )}
              </>)}
              {step === 2 && (<>
                <div className="divide-y divide-ink/8">
                  {items.map((it) => (
                    <div key={it.key} className="flex items-center gap-3 py-2.5">
                      <ArtBox k={it.art} box="h-12 w-12" scale="scale-[0.36]" />
                      <div className="min-w-0 flex-1"><div className="truncate text-[13px] font-medium text-ink">{it.name}</div><div className="text-[11.5px] text-mute">{it.variant ? it.variant + ' · ' : ''}Qty {it.qty}</div></div>
                      <span className="text-[12.5px] text-ink">{eur(it.price * it.qty)}</span>
                    </div>
                  ))}
                </div>
                <div className="mt-3"><DiscountField /></div>
                <div className="mt-3 space-y-1 border-t border-ink/10 pt-3 text-[13px]">
                  <div className="flex justify-between text-mute"><span>Subtotal</span><span>{eur(subtotal)}</span></div>
                  {discount && discountAmount > 0 && <div className="flex justify-between text-gold"><span className="whitespace-nowrap">Discount ({discount.code})</span><span>−{eur(discountAmount)}</span></div>}
                  <div className="flex justify-between text-mute"><span>Shipping</span><span>{shipping === 0 ? 'Free' : eur(shipping)}</span></div>
                  <div className="flex justify-between pt-1 font-semibold text-ink"><span>Total</span><span>{eur(total)}</span></div>
                </div>
                <div className="mt-3 flex items-center justify-between rounded-lg bg-sand/40 px-3 py-2.5 text-[12.5px]">
                  <span className="whitespace-nowrap text-mute">Paying with</span>
                  <span className="flex items-center gap-1.5 whitespace-nowrap font-medium text-ink">{method === 'apple' && <AppleMark size={14} />}{method === 'google' && <GoogleG size={15} />}{method === 'card' && <CardIcon size={15} className="text-mute" />}{method === 'bank' && <BankIcon size={15} className="text-mute" />}{pay.label}</span>
                </div>
                <div className="mt-2 text-[12px] font-light text-mute">Shipping to {info.name}, {info.address}, {info.city} {info.zip}, {info.country}.</div>
              </>)}
            </div>
            <div className="flex items-center gap-2.5 border-t border-ink/10 px-6 py-4">
              {step > 0 && <button onClick={() => setStep(step - 1)} className="rounded-lg border border-ink/15 px-4 py-2.5 text-[12.5px] font-medium text-ink/80 hover:bg-ink/[0.04]">Back</button>}
              {step < 2 && <button onClick={() => setStep(step + 1)} disabled={step === 0 ? !step0Ok : !step1Ok}
                className={`ml-auto rounded-lg px-5 py-2.5 text-[12.5px] font-medium text-paper transition-colors ${(step === 0 ? step0Ok : step1Ok) ? 'bg-ink hover:bg-ink/90' : 'cursor-not-allowed bg-ink/30'}`}>Continue</button>}
              {step === 2 && <button onClick={place} className="ml-auto rounded-lg bg-gold px-6 py-2.5 text-[12.5px] font-medium uppercase tracking-[0.14em] text-white hover:bg-gold/90">{method === 'bank' ? 'Confirm order' : 'Pay ' + eur(total)}</button>}
            </div>
          </>
        )}
      </div>
    </div>
  );
}
function CheckBig() { return <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round" strokeLinejoin="round"><path d="M20 6 9 17l-5-5" /></svg>; }

/* ───────────────────────── Routed pages (Collections · Shop · About) ───────────────────────── */

/* Breadcrumb shown above each inner page. crumbs: [{label, href?}, …] (last item is current). */
function Breadcrumb({ crumbs }) {
  return (
    <nav className="mb-6 flex flex-wrap items-center gap-2 text-[11px] tracking-[0.12em] text-mute">
      {crumbs.map((c, i) => (
        <span key={i} className="flex items-center gap-2">
          {i > 0 && <span className="text-mute/50">/</span>}
          {c.href ? <a href={c.href} className="uppercase transition-colors hover:text-ink">{c.label}</a>
                  : <span className="uppercase text-ink/70">{c.label}</span>}
        </span>
      ))}
    </nav>
  );
}

/* A responsive product grid that reuses the carousel's ProductCard (fixed 200px) centered per cell. */
function ProductGrid({ products }) {
  if (!products.length) {
    return (
      <div className="flex flex-col items-center justify-center rounded-xl border border-ink/10 bg-paper/60 px-6 py-20 text-center">
        <div className="mb-3 text-mute">{Art.shell}</div>
        <div className="font-serif text-[20px] text-ink">Nothing here yet</div>
        <p className="mt-2 text-[13px] font-light text-mute">New pieces for this collection are on the way.</p>
        <a href="#/shop" className="mt-5 rounded-full bg-ink px-6 py-2.5 text-[12px] font-medium uppercase tracking-[0.16em] text-paper hover:bg-ink/90">Browse all pieces</a>
      </div>
    );
  }
  return (
    <div className="grid grid-cols-2 justify-items-center gap-x-6 gap-y-12 sm:grid-cols-3 lg:grid-cols-4">
      {products.map((p) => <ProductCard key={p.id} p={p} />)}
    </div>
  );
}

/* #/collections — index of every collection as a card, reusing the landing CollectionCard look. */
function CollectionsIndex() {
  const beadsMotif = (
    <svg viewBox="0 0 320 240" className="h-3/5 w-auto" fill="none" stroke={GOLD} strokeWidth="2" strokeLinecap="round">
      <path d="M30 96 Q160 168 290 96" opacity="0.5" />
      {Array.from({ length: 13 }).map((_, i) => {
        const t = i / 12; const x = 30 + t * 260; const y = 96 + Math.sin(Math.PI * t) * 70;
        return <circle key={i} cx={x} cy={y} r={i % 2 ? 11 : 8} />;
      })}
    </svg>
  );
  return (
    <section className="mx-auto w-full max-w-[1240px] px-8 pb-4 pt-12">
      <Breadcrumb crumbs={[{ label: 'Home', href: '#/' }, { label: 'Collections' }]} />
      <header className="mb-12 text-center">
        <h2 className="font-serif text-[40px] font-medium leading-tight tracking-[0.02em] text-ink">Collections</h2>
        <p className="mx-auto mt-3 max-w-xl text-[13.5px] font-light leading-relaxed tracking-wide text-mute">
          Soulful, handmade jewelry inspired by the Aegean &mdash; explore each edit of gemstones, shells &amp; minerals.
        </p>
      </header>
      <div className="grid grid-cols-1 gap-7 sm:grid-cols-2 lg:grid-cols-3">
        {COLLECTIONS.map((name, i) => {
          const slug = slugify(name);
          const n = productsInCollection(slug).length;
          return (
            <CollectionCard
              key={slug}
              tone={i % 2 === 1 ? 'dark' : 'light'}
              eyebrow={name}
              label={n + (n === 1 ? ' piece' : ' pieces')}
              motif={beadsMotif}
              href={'#/collections/' + slug}
            />
          );
        })}
      </div>
    </section>
  );
}

/* #/collections/<slug> — filtered product grid. new-in shows all active products. */
function CollectionPage({ slug }) {
  const name = collectionNameForSlug(slug);
  const products = productsInCollection(slug);
  return (
    <section className="mx-auto w-full max-w-[1240px] px-8 pb-4 pt-12">
      <Breadcrumb crumbs={[{ label: 'Home', href: '#/' }, { label: 'Collections', href: '#/collections' }, { label: name || slug }]} />
      <header className="mb-12 text-center">
        <div className="text-[11px] font-medium uppercase tracking-[0.2em] text-gold">Collection</div>
        <h2 className="mt-2 font-serif text-[40px] font-medium leading-tight tracking-[0.02em] text-ink">{name || 'Collection'}</h2>
        {!name ? (
          <p className="mx-auto mt-3 max-w-md text-[13.5px] font-light leading-relaxed text-mute">We couldn&rsquo;t find that collection. <a href="#/collections" className="text-gold hover:text-ink">Browse all collections →</a></p>
        ) : (
          <p className="mx-auto mt-3 max-w-md text-[13.5px] font-light leading-relaxed text-mute">{products.length}{products.length === 1 ? ' handmade piece' : ' handmade pieces'} in the {name} edit.</p>
        )}
      </header>
      <ProductGrid products={products} />
    </section>
  );
}

/* #/shop — "Jewelry & Accessories": every active product. */
function ShopPage() {
  return (
    <section className="mx-auto w-full max-w-[1240px] px-8 pb-4 pt-12">
      <Breadcrumb crumbs={[{ label: 'Home', href: '#/' }, { label: 'Jewelry & Accessories' }]} />

/* ───────────────────────── App ───────────────────────── */
function Home() {
  return (
    <>
      <Hero />
      <ShopByCollection />
      <Carousel />
      <VisitUs />
      <Promo />
    </>
  );
}

function RoutedMain() {
  const route = useHashRoute();
  switch (route.name) {
    case 'collections': return <main><CollectionsIndex /><Promo /></main>;
    case 'collection':  return <main><CollectionPage slug={route.slug} /><Promo /></main>;
    case 'shop':        return <main><ShopPage /><Promo /></main>;
    case 'about':       return <main><AboutPage /><VisitUs /><Promo /></main>;
    case 'home':
    default:            return <main><Home /></main>;
  }
}

function App() {
  return (
    <ShopProvider>
      <div className="min-h-screen font-sans text-ink">
        <AnnouncementBar />
        <header>
          <TopBar />
          <Nav />
        </header>
        <RoutedMain />
        <SiteFooter />
        <ChatWidget />
        <EntryPopup />
        <PDPModal />
        <WishDrawer />
        <CartDrawer />
        <Checkout />
      </div>
    </ShopProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
